[project]
name = "job-hunt"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "google-auth>=2.36.0",
    "google-auth-oauthlib>=1.4.0",
    "gspread>=6.1.4",
    "jinja2>=3.1.6",
    "playwright>=1.49",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "typer>=0.27.0",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
jobhunt = "jobhunt.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.ruff]
# Explicit anchor: without this, ruff's config discovery (which appears to
# walk from the invoking process's cwd, not just the target file's own
# ancestor chain) can pick up a sibling repo's stricter pyproject.toml (e.g.
# a sibling project's `select = [..., "B", ...]`) when a hook or tool runs with cwd
# set elsewhere. Keep this file the authoritative root for this project.
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The distribution is "job-hunt" but the package directory is "jobhunt", which
# hatchling will not infer. The frontend's node_modules lives inside the package
# tree and is 145M of build input nobody wants in a wheel.
packages = ["jobhunt"]
exclude = ["web/frontend/node_modules", "web/frontend/dist"]
