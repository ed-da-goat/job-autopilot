name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # uv reads the Python version from .python-version (3.12) and installs it if needed.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - run: uv run pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jobhunt/web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: jobhunt/web/frontend
        run: npm ci

      - run: make ui-test

      - run: make ui-build
