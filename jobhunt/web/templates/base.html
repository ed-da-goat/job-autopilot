<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}job-hunt{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">job-hunt</span>{% if demo_mode %} <strong style="background:#f5b800;color:#111;padding:2px 8px;border-radius:4px">DEMO DATA</strong>{% endif %}
    <nav>
      <a href="/legacy" class="{{ 'active' if active == 'today' else '' }}">Today</a>
      <a href="/pipeline" class="{{ 'active' if active == 'board' else '' }}">Pipeline</a>
      <a href="/people" class="{{ 'active' if active == 'people' else '' }}">People</a>
      <a href="/interviews" class="{{ 'active' if active == 'interviews' else '' }}">Interviews</a>
      <a href="/shortlist" class="{{ 'active' if active == 'shortlist' else '' }}">Shortlist</a>
      <a href="/postings" class="{{ 'active' if active == 'postings' else '' }}">Postings</a>
      <a href="/report" class="{{ 'active' if active == 'report' else '' }}">Analytics</a>
      <a href="/digest" class="{{ 'active' if active == 'digest' else '' }}">Digest</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
